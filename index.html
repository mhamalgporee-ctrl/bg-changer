<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>عدل خلفية الصورة - الذكاء الاصطناعي من Google</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="w.png">
    
    <!-- مكتبة الذكاء الاصطناعي الرسمية من جوجل (Google MediaPipe) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation"></script>

    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #f8f9fa; 
            color: #333; 
        }
        .app-container { 
            max-width: 500px; 
            margin: 0 auto; 
            min-height: 100vh; 
            background: rgba(255, 255, 255, 0.98); 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            box-shadow: 0 0 20px rgba(0,0,0,0.08); 
        }
        .header { text-align: center; margin-bottom: 25px; width: 100%; }
        .header h1 { font-size: 26px; color: #1a73e8; margin: 10px 0; }
        .header h2 { font-size: 20px; color: #111111; font-weight: bold; margin: 5px 0; }
        .designer-name { font-size: 14px; color: #4a5568; font-weight: bold; margin-top: 8px; display: block; }
        .ai-badge { 
            display: inline-block;
            background: #e8f0fe;
            color: #1a73e8;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 8px;
        }
        .image-section { width: 100%; display: flex; flex-direction: row; gap: 12px; margin-bottom: 20px; }
        .image-card { flex: 1; background: #f0f4f8; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .card-title { font-size: 14px; font-weight: bold; color: #2c3e50; margin-bottom: 10px; display: flex; align-items: center; gap: 4px; }
        .image-box { width: 100%; height: 180px; border-radius: 12px; background-color: #ffffff; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; border: 1px solid #e2e8f0; }
        .image-box span { font-size: 13px; color: #a0aec0; text-align: center; padding: 10px; }
        .image-box img { width: 100%; height: 100%; object-fit: contain; display: none; }
        .loading-text { display: none; color: #1a73e8; font-weight: bold; margin-bottom: 15px; text-align: center; font-size: 14px; padding: 12px; background: #e8f0fe; border-radius: 8px; width: 100%; border: 1px solid #aecbfa; }
        .btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s ease-in-out; margin-bottom: 12px; text-align: center; display: flex; justify-content: center; align-items: center; gap: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-upload { background-color: #1a73e8; color: white; display: flex; }
        .btn-upload:active { transform: scale(0.98); }
        .btn-process { background-color: #9333ea; color: white; display: none; }
        .btn-process:active { transform: scale(0.98); }
        .btn-process:disabled { background-color: #c084fc; cursor: not-allowed; }
        .btn-save { background-color: #10b981; color: white; display: none; }
        .btn-save:active { transform: scale(0.98); }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>عدل خلفية الصورة</h1>
        <h2>عدل صورتك الى خلفية بيضاء</h2>
        <span class="designer-name">تصميم محمد علي احمد الحطاب</span>
        <span class="ai-badge">🤖 مدعوم بالذكاء الاصطناعي من Google</span>
    </div>

    <div class="image-section">
        <div class="image-card">
            <div class="card-title"><span>⬆️</span> الصورة المحملة</div>
            <div class="image-box">
                <span id="text1">لم يتم اختيار صورة</span>
                <img id="imgOriginal" alt="الصورة المحملة" crossorigin="anonymous">
            </div>
        </div>

        <div class="image-card">
            <div class="card-title"><span>🖼️</span> الصورة المعدلة</div>
            <div class="image-box">
                <span id="text2">تنتظر التعديل</span>
                <canvas id="canvasEdited" style="display:none;"></canvas>
                <img id="imgEdited" alt="الصورة المعدلة">
            </div>
        </div>
    </div>

    <div id="loadingStatus" class="loading-text">⏳ جاري معالجة الصورة بواسطة Google AI...</div>

    <label class="btn btn-upload">
        📷 تحميل صورة من الموبايل
        <input type="file" id="fileInput" accept="image/*">
    </label>
    
    <button class="btn btn-process" id="processBtn">🪄 تحويل إلى خلفية بيضاء</button>
    <button class="btn btn-save" id="saveBtn">📥 حفظ على الموبايل</button>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const imgOriginal = document.getElementById('imgOriginal');
    const text1 = document.getElementById('text1');
    
    const imgEdited = document.getElementById('imgEdited');
    const canvasEdited = document.getElementById('canvasEdited');
    const text2 = document.getElementById('text2');
    
    const processBtn = document.getElementById('processBtn');
    const saveBtn = document.getElementById('saveBtn');
    const loadingStatus = document.getElementById('loadingStatus');

    // تهيئة محرك الذكاء الاصطناعي الخاص بـ Google MediaPipe
    const selfieSegmentation = new SelfieSegmentation({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
    });

    selfieSegmentation.setOptions({
        modelSelection: 1, // اختيار النموذج السريع والمناسب للهواتف
    });

    // استلام النتائج ورسم الصورة بخلفية بيضاء
    selfieSegmentation.onResults((results) => {
        const width = results.image.width;
        const height = results.image.height;

        canvasEdited.width = width;
        canvasEdited.height = height;
        const ctx = canvasEdited.getContext('2d');

        // كانفاس فرعي لعزل الشخص
        const offCanvas = document.createElement('canvas');
        offCanvas.width = width;
        offCanvas.height = height;
        const offCtx = offCanvas.getContext('2d');

        // رسم قناع العزل
        offCtx.drawImage(results.segmentationMask, 0, 0, width, height);

        // دمج قناع الشخص مع الصورة الأصلية
        offCtx.globalCompositeOperation = 'source-in';
        offCtx.drawImage(results.image, 0, 0, width, height);

        // رسم خلفية بيضاء ناصعة
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(offCanvas, 0, 0);

        // عرض النتيجة للستخدم
        imgEdited.src = canvasEdited.toDataURL('image/jpeg', 0.95);
        imgEdited.style.display = 'block';
        text2.style.display = 'none';
        
        saveBtn.style.display = 'flex';
        loadingStatus.style.display = 'none';
        processBtn.disabled = false;
    });

    // اختيار صورة من الهاتف
    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const imageUrl = URL.createObjectURL(file);
        imgOriginal.src = imageUrl;

        imgOriginal.onload = function() {
            imgOriginal.style.display = 'block';
            text1.style.display = 'none';
            
            processBtn.style.display = 'flex';
            processBtn.disabled = false;
            imgEdited.style.display = 'none';
            text2.style.display = 'block';
            text2.innerText = 'تنتظر التعديل';
            saveBtn.style.display = 'none';
            loadingStatus.style.display = 'none';
        };
    });

    // بدء عملية التعديل عند الضغط على الزر
    processBtn.addEventListener('click', async function() {
        if (!imgOriginal.src) return;

        try {
            processBtn.disabled = true;
            loadingStatus.style.display = 'block';
            loadingStatus.innerText = '⏳ جاري المعالجة بواسطة الذكاء الاصطناعي من جوجل...';
            text2.innerText = 'جاري التعديل...';

            await selfieSegmentation.send({ image: imgOriginal });

        } catch (error) {
            console.error(error);
            loadingStatus.innerText = '❌ حدث خطأ أثناء المعالجة، يرجى المحاولة مرة أخرى.';
            processBtn.disabled = false;
            text2.innerText = 'فشلت العملية';
        }
    });

    // تنزيل الصورة
    saveBtn.addEventListener('click', function() {
        const link = document.createElement('a');
        link.download = 'صورة_معدلة_محمد_الحطاب.jpg';
        link.href = imgEdited.src;
        link.click();
    });
</script>
</body>
</html>
