<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مُزيل الخلفيات بالذكاء الاصطناعي</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="w.png">
    
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #f8f9fa; 
            color: #333; 
        }
        .app-container { 
            max-width: 500px; 
            margin: 0 auto; 
            min-height: 100vh; 
            background: rgba(255, 255, 255, 0.98); 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            box-shadow: 0 0 20px rgba(0,0,0,0.08); 
        }
        .header { text-align: center; margin-bottom: 25px; width: 100%; }
        .header h1 { font-size: 26px; color: #1a73e8; margin: 10px 0; }
        .header h2 { font-size: 20px; color: #111111; font-weight: bold; margin: 5px 0; }
        .designer-name { font-size: 14px; color: #4a5568; font-weight: bold; margin-top: 8px; display: block; }
        .ai-badge { 
            display: inline-block;
            background: #e8f0fe;
            color: #1a73e8;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-top: 10px;
            border: 1px solid #aecbfa;
        }
        .image-section { width: 100%; display: flex; flex-direction: row; gap: 12px; margin-bottom: 20px; }
        .image-card { flex: 1; background: #f0f4f8; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .card-title { font-size: 14px; font-weight: bold; color: #2c3e50; margin-bottom: 10px; display: flex; align-items: center; gap: 4px; }
        .image-box { width: 100%; height: 180px; border-radius: 12px; background-color: #ffffff; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; border: 1px solid #e2e8f0; }
        .image-box span { font-size: 13px; color: #a0aec0; text-align: center; padding: 10px; }
        .image-box img { width: 100%; height: 100%; object-fit: contain; display: none; }
        .loading-text { display: none; color: #1a73e8; font-weight: bold; margin-bottom: 15px; text-align: center; font-size: 14px; padding: 12px; background: #e8f0fe; border-radius: 8px; width: 100%; border: 1px solid #aecbfa; }
        .btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s ease-in-out; margin-bottom: 12px; text-align: center; display: flex; justify-content: center; align-items: center; gap: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-upload { background-color: #1a73e8; color: white; display: flex; }
        .btn-upload:active { transform: scale(0.98); }
        .btn-process { background-color: #7c3aed; color: white; display: none; }
        .btn-process:active { transform: scale(0.98); }
        .btn-process:disabled { background-color: #a78bfa; cursor: not-allowed; }
        .btn-save { background-color: #10b981; color: white; display: none; }
        .btn-save:active { transform: scale(0.98); }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>عدل خلفية الصورة</h1>
        <h2>عدل صورتك الى خلفية بيضاء</h2>
        <span class="designer-name">تصميم محمد علي احمد الحطاب</span>
        <span class="ai-badge">✨ محرك الذكاء الاصطناعي عالي الدقة</span>
    </div>

    <div class="image-section">
        <div class="image-card">
            <div class="card-title"><span>⬆️</span> الصورة المحملة</div>
            <div class="image-box">
                <span id="text1">لم يتم اختيار صورة</span>
                <img id="imgOriginal" alt="الصورة المحملة" crossorigin="anonymous">
            </div>
        </div>

        <div class="image-card">
            <div class="card-title"><span>🖼️</span> الصورة المعدلة</div>
            <div class="image-box">
                <span id="text2">تنتظر التعديل</span>
                <canvas id="canvasEdited" style="display:none;"></canvas>
                <img id="imgEdited" alt="الصورة المعدلة">
            </div>
        </div>
    </div>

    <div id="loadingStatus" class="loading-text">⏳ جاري المعالجة بالذكاء الاصطناعي...</div>

    <label class="btn btn-upload">
        📷 تحميل صورة من الموبايل
        <input type="file" id="fileInput" accept="image/*">
    </label>
    
    <button class="btn btn-process" id="processBtn">🪄 تحويل إلى خلفية بيضاء</button>
    <button class="btn btn-save" id="saveBtn">📥 حفظ على الموبايل</button>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const imgOriginal = document.getElementById('imgOriginal');
    const text1 = document.getElementById('text1');
    
    const imgEdited = document.getElementById('imgEdited');
    const canvasEdited = document.getElementById('canvasEdited');
    const text2 = document.getElementById('text2');
    
    const processBtn = document.getElementById('processBtn');
    const saveBtn = document.getElementById('saveBtn');
    const loadingStatus = document.getElementById('loadingStatus');

    let currentFile = null;

    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        currentFile = file;
        const imageUrl = URL.createObjectURL(file);
        imgOriginal.src = imageUrl;

        imgOriginal.onload = function() {
            imgOriginal.style.display = 'block';
            text1.style.display = 'none';
            
            processBtn.style.display = 'flex';
            processBtn.disabled = false;
            imgEdited.style.display = 'none';
            text2.style.display = 'block';
            text2.innerText = 'تنتظر التعديل';
            saveBtn.style.display = 'none';
            loadingStatus.style.display = 'none';
        };
    });

    processBtn.addEventListener('click', async function() {
        if (!currentFile) return;

        try {
            processBtn.disabled = true;
            loadingStatus.style.display = 'block';
            loadingStatus.innerText = '⏳ جاري استدعاء نموذج الرؤية البصرية وعزل الحواف بدقة عالية...';
            text2.innerText = 'جاري التعديل...';

            // استدعاء محرك الذكاء الاصطناعي المعالج للرؤية البصرية بدقة فائقة
            const module = await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm');
            const imglyRemoveBackground = module.default;

            const config = {
                publicPath: 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/dist/',
                model: 'medium', // استخدام نموذج عالي الدقة لمنع تشرشر الأطراف
                progress: (key, current, total) => {
                    if (total > 0) {
                        const percent = Math.round((current / total) * 100);
                        loadingStatus.innerText = `⏳ جاري العزل بدقة بكسل عالية (${percent}%)...`;
                    }
                }
            };

            const blob = await imglyRemoveBackground(currentFile, config);
            const transparentImg = new Image();
            transparentImg.src = URL.createObjectURL(blob);

            transparentImg.onload = function() {
                const ctx = canvasEdited.getContext('2d');
                canvasEdited.width = transparentImg.width;
                canvasEdited.height = transparentImg.height;

                // تنعيم جودة الرسم
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';

                // رسم الخلفية البيضاء النقية
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(0, 0, canvasEdited.width, canvasEdited.height);

                // دمج الصورة المقطوعة بنقاء
                ctx.drawImage(transparentImg, 0, 0);

                imgEdited.src = canvasEdited.toDataURL('image/jpeg', 0.98);
                imgEdited.style.display = 'block';
                text2.style.display = 'none';
                
                saveBtn.style.display = 'flex';
                loadingStatus.style.display = 'none';
                processBtn.disabled = false;
            };

        } catch (error) {
            console.error(error);
            loadingStatus.innerText = '❌ تعذر إكمال العملية، يرجى التأكد من اتصال الإنترنت والمحاولة مجدداً.';
            processBtn.disabled = false;
            text2.innerText = 'فشلت العملية';
        }
    });

    saveBtn.addEventListener('click', function() {
        const link = document.createElement('a');
        link.download = 'صورة_معدلة_محمد_الحطاب.jpg';
        link.href = imgEdited.src;
        link.click();
    });
</script>
</body>
</html>
